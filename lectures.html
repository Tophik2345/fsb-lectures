<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>УЦ · ФСБ</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,sans-serif;
    color:#efe8dc;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(139,28,42,.28), transparent 55%),
      radial-gradient(700px 400px at 80% 110%, rgba(196,163,90,.10), transparent 50%),
      #0c0d10;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .panel{
    width:min(560px,100%);
    background:linear-gradient(180deg,#16181d,#121318);
    border:1px solid rgba(196,163,90,.22);
    border-radius:18px;
    padding:28px 28px 26px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .kicker{
    color:#c4a35a;letter-spacing:.18em;font-size:11px;
    text-transform:uppercase;font-weight:700;margin:0 0 10px;
  }
  h1{margin:0 0 8px;font-size:30px;line-height:1.15;font-weight:700;color:#f4efe6}
  .rule{height:1px;background:linear-gradient(90deg,#c4a35a,transparent);margin:16px 0 20px}
  a.btn{
    display:block;text-decoration:none;color:#f4efe6;
    background:#1b1e25;border:1px solid rgba(244,239,230,.08);
    border-radius:14px;padding:16px 16px 15px;margin:0 0 12px;transition:.15s ease;
  }
  a.btn:hover{border-color:rgba(196,163,90,.45);background:#22181b;transform:translateY(-1px)}
  .num{color:#c4a35a;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .ttl{font-size:20px;font-weight:700;margin:4px 0 4px}
  .dsc{margin:0;color:#9a9388;font-size:14px;line-height:1.45}
</style>
</head>
<body>
  <div class="panel">
    <p class="kicker">ФСБ · Академия · Управление УЦ</p>
    <h1>Какую лекцию хотите провести</h1>
    <div class="rule"></div>

    <a class="btn" href="lecture1.html">
      <div class="num">Лекция 1</div>
      <div class="ttl">Вводная</div>
      <p class="dsc">Кто такая ФСБ, смена, управления, форма, цепочка обращений.</p>
    </a>
    <a class="btn" href="lecture2.html">
      <div class="num">Лекция №2 УЦ</div>
      <div class="ttl">Лекция №2</div>
      <p class="dsc">Неприкосновенность, ПГО, УК, ПК, законы, оружие.</p>
    </a>
    <a class="btn" href="lecture3.html">
      <div class="num">Лекция УК+ПК</div>
      <div class="ttl">УК + ПК</div>
      <p class="dsc">Уголовный и процессуальный кодекс. Как применять на улице.</p>
    </a>
  </div>
</body>
</html>
